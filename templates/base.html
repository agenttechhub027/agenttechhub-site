{% load static %}
<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgentTechHub{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}AgentTechHub{% endblock %}">

    <link rel="icon" type="image/png" href="{% static 'logosemfundo.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-background: #000000;
            --color-foreground: #FFFFFF;
            --color-primary: #0066FF;
            --color-primary-alt: #008CFF;
            --color-accent: #00BFFF;
            --color-link: #0099FF;

            --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
            --font-display: 'Space Grotesk', 'Inter', ui-sans-serif, sans-serif;
        }

        @layer base {
            h1, h2, h3, h4, h5, h6 {
                font-family: var(--font-display);
            }
        }

        [x-cloak] {
            display: none !important;
        }
    </style>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans bg-background text-foreground antialiased">

    {% include 'layout/_header.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'layout/_footer.html' %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
