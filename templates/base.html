{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgentTechHub{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}AgentTechHub{% endblock %}">

    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16x16.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    {% tailwind_css %}

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans bg-background text-foreground antialiased">

    {% include 'layout/_header.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'layout/_footer.html' %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
