{% load static %}
<header
    x-data="{ open: false }"
    x-on:keydown.escape.window="open = false"
    class="sticky top-0 z-50 border-b border-foreground/10 bg-background/80 backdrop-blur-md"
>
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">

        <a href="{% url 'home' %}" class="flex items-center gap-2 shrink-0">
            <img src="{% static 'logosemfundo.png' %}" alt="AgentTechHub" class="h-8 w-auto">
        </a>

        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-foreground/70">
            <a href="{% url 'home' %}" class="transition-colors hover:text-foreground">Home</a>
            <a href="{% url 'sobre' %}" class="transition-colors hover:text-foreground">Sobre</a>
            <a href="{% url 'servicos' %}" class="transition-colors hover:text-foreground">Serviços</a>
            <a href="{% url 'portfolio_lista' %}" class="transition-colors hover:text-foreground">Portfólio</a>
            <a href="{% url 'contato' %}" class="transition-colors hover:text-foreground">Contato</a>
        </nav>

        <a
            href="{% url 'contato' %}"
            class="hidden md:inline-flex items-center rounded-full bg-gradient-to-r from-primary to-accent px-5 py-2.5 text-sm font-semibold text-white shadow-[0_0_20px_-6px_var(--color-accent)] transition-shadow duration-300 hover:shadow-[0_0_28px_-4px_var(--color-accent)]"
        >
            Fale com a gente
        </a>

        <button
            type="button"
            x-on:click="open = !open"
            class="md:hidden relative flex h-11 w-11 items-center justify-center"
            :aria-expanded="open"
            aria-label="Abrir menu"
        >
            <span class="sr-only">Abrir menu</span>
            <span class="flex h-4 w-6 flex-col justify-between">
                <span
                    class="h-0.5 w-full origin-left bg-foreground transition-transform duration-300"
                    :class="open && 'rotate-45'"
                ></span>
                <span
                    class="h-0.5 w-full bg-foreground transition-opacity duration-300"
                    :class="open && 'opacity-0'"
                ></span>
                <span
                    class="h-0.5 w-full origin-left bg-foreground transition-transform duration-300"
                    :class="open && '-rotate-45'"
                ></span>
            </span>
        </button>
    </div>

    <div
        x-show="open"
        x-cloak
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-2"
        x-transition:enter-end="opacity-100 translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100 translate-y-0"
        x-transition:leave-end="opacity-0 -translate-y-2"
        class="md:hidden border-t border-foreground/10 bg-background/95 backdrop-blur-md"
    >
        <nav class="flex flex-col gap-1 px-6 py-6 text-sm font-medium text-foreground/70">
            <a href="{% url 'home' %}" class="rounded-lg px-3 py-2.5 transition-colors hover:bg-foreground/5 hover:text-foreground">Home</a>
            <a href="{% url 'sobre' %}" class="rounded-lg px-3 py-2.5 transition-colors hover:bg-foreground/5 hover:text-foreground">Sobre</a>
            <a href="{% url 'servicos' %}" class="rounded-lg px-3 py-2.5 transition-colors hover:bg-foreground/5 hover:text-foreground">Serviços</a>
            <a href="{% url 'portfolio_lista' %}" class="rounded-lg px-3 py-2.5 transition-colors hover:bg-foreground/5 hover:text-foreground">Portfólio</a>
            <a href="{% url 'contato' %}" class="rounded-lg px-3 py-2.5 transition-colors hover:bg-foreground/5 hover:text-foreground">Contato</a>
            <a
                href="{% url 'contato' %}"
                class="mt-3 inline-flex items-center justify-center rounded-full bg-gradient-to-r from-primary to-accent px-5 py-2.5 text-sm font-semibold text-white"
            >
                Fale com a gente
            </a>
        </nav>
    </div>
</header>
